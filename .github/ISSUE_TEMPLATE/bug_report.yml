name: Bug report
description: Something looks wrong or does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: e.g. Chrome 131 on macOS 15
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Settings when it happened
      description: Viewing angle, gravity strength, and which toggles were on.
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: Drag an image here if it helps.
